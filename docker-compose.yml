services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: events
    volumes:
      - ./app/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events"]
      interval: 5s
      retries: 10

  api:
    build: ./app
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/events
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
